name: Check inbox posts

on:
  push:
    paths: ["inbox/**"]
  pull_request:
    paths: ["inbox/**"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/validate_inbox.py
